<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Manu 💙</title>
  <style>
      body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #090909, #66a6ff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
.galeria {
  display: none;
  margin-top: 30px;
  animation: fadeIn 2s ease;
}

.galeria h2 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 22px;
}

.fotos {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.fotos img {
  width: 100%;
  border-radius: 20px;
  object-fit: cover;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  transition: all .4s ease;
  opacity: 0;
  animation: surgir 1s forwards;
}

.fotos img:hover {
  transform: scale(1.03);
}

.assinatura {
  text-align: center;
  margin-top: 25px;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
}

.card::-webkit-scrollbar {
  width: 8px;
}

.card::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.4);
  border-radius: 20px;
}
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 2s ease;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    p {
      line-height: 1.7;
      font-size: 16px;
      white-space: pre-line;
    }

   .btn {
  display: block;
  margin: 20px auto 0;
  padding: 12px 25px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg,#ffffff,#dbeafe);
  color: #2a5298;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
  box-shadow: 0 5px 15px rgba(0,0,0,.2);
}
    .btn:hover {
      transform: scale(1.05);
    }

   @keyframes surgir {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  </style>
</head>
<body>

  <div class="card">
 <h1>Uma pequena surpresa para você ✨</h1>

<p style="text-align:center;">
Clique abaixo quando estiver pronta para ler.
</p>
    <p id="mensagem"></p>
    <button class="btn" onclick="mostrarTexto()">Clique para ler 💙</button>

    <div class="galeria" id="galeria">
  <h2>Alguns momentos especiais que me fazem lembrar de você  💙</h2>

  <div class="fotos">
  <img src="img/1.jpeg" alt="Foto 1">
<img src="img/2.jpg" alt="Foto 2">
<img src="img/3.jpg" alt="Foto 3">
  </div>
  <div class="assinatura">
    💙 Com carinho,<br>
    Gabriel
</div>
</div>
  </div>

  <script>
    const texto = `Boa noite, Manuelle Meneses. Tudo bem?

Manu, esse já é o meu sexto áudio tentando gravar um feliz aniversário para você. Pode parecer algo simples: escrever um texto rápido, falar algumas palavras bonitas e acabou, né? O problema é que, quando se trata de você, nunca é fácil. E não é porque você seja difícil, muito pelo contrário. É porque falar sobre você é algo que se torna extraordinário.

Falar sobre você é reconhecer que existem pessoas que aparecem do nada na nossa vida e mudam tudo de cabeça para baixo. E não que isso seja algo ruim, não, não. Você foi a pessoa que me fez entender que existe, sim, um bom relacionamento com os pais, mesmo sendo cristão. Você foi a pessoa que me ensinou o verdadeiro significado de paz, harmonia e, com toda certeza, como fazer um ótimo bolo, né?

Acho que, em todas as minhas vidas, se eu pudesse colocar a Manuelle Meneses nelas, eu faria o impossível para tê-la.

Sei que nossa amizade começou de uma forma engraçada, com toda aquela situação da Fabi, mas eu sou grato todos os dias por isso ter acontecido. Se eu não tivesse conhecido a Fabi, provavelmente não conheceria a verdadeira pessoa que você é!

Eu sempre vou comemorar todas as suas conquistas, porque elas são minhas também. Você tem um chamado, Manuelle, tão incrível que não tem como descrevê-lo de uma forma simples. No domingo à noite, eu pude presenciar um pouco da Manuelle da intercessão, e você não tem noção da felicidade que eu senti! Fiquei feliz porque vi que alguém com um brilho tão lindo quanto o seu estava servindo e caminhando ao lado de Cristo.

Confesso que, no começo, tive medo de falar com você. Tive medo de você achar que eu não seria alguém tão legal para conversar. Mas acho que esse não é o principal assunto de hoje, né?

Hoje é o seu aniversário, então aqui vai o que realmente importa:

Manuelle, eu sou muito grato por quem você é. Você é uma filha dedicada, uma amiga presente, uma tia sensacional e uma pessoa com um chamado tão bonito que é impossível descrevê-lo em palavras, em um áudio ou em qualquer outra coisa do gênero.

Você tem um brilho que vem do Espírito Santo. Tem um olhar que transmite paz e parece dizer: "Deus, eu estou aqui."

E eu acredito que todo mundo merece ter uma Manuelle Meneses na vida. Porque você é porto seguro para muita gente. É porto seguro para a Fabi, para a Maria e para a Giovanna e, de certa forma, também para mim.

Eu agradeço todos os dias pelo carinho que você tem com a minha prima. A Daniela é a coisa mais próxima que eu tenho de uma irmã, e saber que posso confiar em outra pessoa para cuidar dela e aconselhá-la é muito gratificante.

Sei que, às vezes, eu tenho meus surtos, se assim posso dizer, né? Mas sei que, mesmo que eu tenha um dia difícil e queira desistir de tudo, vai ter você na outra ponta para me segurar.

Admito que sou péssimo com datas. Na verdade, fiquei com tanto medo de esquecer seu aniversário que coloquei um lembrete no meu celular, no meu computador e no meu tablet.

E eu te faço uma promessa, Manuelle: sempre que o seu mundo parecer desabar, eu vou ser o primeiro a tentar levantá-lo com você.

Continue tendo esse brilho que você tem. Continue sendo linda, assim como o Espírito Santo reflete em você.

Obrigado por ser exatamente quem você é.

Que Deus continue te usando de maneira poderosa, que nunca faltem motivos para sorrir, que seu chamado floresça cada vez mais e que você nunca esqueça o quanto é amada pelas pessoas que têm você ao redor. E eu fico muito feliz por ter o privilégio de caminhar ao seu lado.

Feliz aniversário, Manuelle Meneses. Que o Senhor continue te usando como ferramenta d'Ele!

(E precisamos marcar de ir naquele parque de cama elástica, né?)

Com carinho,
Gabriel`;
function mostrarTexto() {
  const btn = document.querySelector(".btn");
  const galeria = document.getElementById("galeria");
  const msg = document.getElementById("mensagem");

  btn.style.display = "none";

  let i = 0;
  const speed = 18;

  function typeWriter() {
    if (i < texto.length) {
      msg.innerHTML += texto.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
    } else {
      galeria.style.display = "block";
    }
  }

  typeWriter();
}
  </script>

</body>
</html>
